<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="logo.png" type="image/png" />
    <title>404 - Page Not Found | Laura Fonseca Portfolio</title>
    <!-- Google Fonts: Instrument Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/index.css" />
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
      .error-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
        text-align: center;
      }

      .error-number {
        font-family: var(--font-family-serif);
        font-size: clamp(8rem, 20vw, 20rem);
        color: var(--primary-color);
        line-height: 1;
        margin: 0;
        font-weight: 400;
      }

      .error-title {
        font-family: var(--font-family-helvetica);
        font-size: clamp(2rem, 5vw, 4rem);
        color: var(--primary-color);
        margin: 2rem 0 1rem;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      .error-description {
        font-family: var(--font-family-helvetica);
        font-size: clamp(1rem, 2vw, 1.3rem);
        color: var(--black);
        max-width: 500px;
        margin: 1rem 0 3rem;
        line-height: 1.6;
      }

      .error-button {
        background: var(--primary-color);
        color: var(--white);
        border: 2px solid var(--primary-color);
        padding: 12px 40px;
        border-radius: 30px;
        font-family: var(--font-family-helvetica);
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.3s;
        text-decoration: none;
        display: inline-block;
      }

      .error-button:hover {
        background: transparent;
        color: var(--primary-color);
        transform: scale(1.05);
      }

      @media (max-width: 768px) {
        .error-container {
          margin-top: 5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="cursor"></div>
    <main>
      <section class="error-container">
        <h1 class="error-number">404</h1>
        <h2 class="error-title" data-translate="error_title">Page Not Found</h2>
        <p class="error-description" data-translate="error_description">
          Oops! The page you're looking for doesn't exist. Let's get you back on
          track.
        </p>
        <a href="index.html" class="error-button" data-translate="back_home"
          >Back Home</a
        >
      </section>
    </main>

    <script src="assets/js/main.js"></script>
    <script>
      // 404 specific animations
      document.addEventListener("DOMContentLoaded", function () {
        // Animate error number
        gsap.fromTo(
          ".error-number",
          {
            opacity: 0,
            y: 50,
          },
          {
            opacity: 1,
            y: 0,
            duration: 1,
            ease: "power3.out",
          }
        );

        // Animate title
        gsap.fromTo(
          ".error-title",
          {
            opacity: 0,
            y: 30,
          },
          {
            opacity: 1,
            y: 0,
            duration: 0.8,
            delay: 0.3,
            ease: "power2.out",
          }
        );

        // Animate description
        gsap.fromTo(
          ".error-description",
          {
            opacity: 0,
            y: 20,
          },
          {
            opacity: 1,
            y: 0,
            duration: 0.8,
            delay: 0.5,
            ease: "power2.out",
          }
        );

        // Animate button
        gsap.fromTo(
          ".error-button",
          {
            opacity: 0,
            scale: 0.8,
          },
          {
            opacity: 1,
            scale: 1,
            duration: 0.8,
            delay: 0.7,
            ease: "back.out(1.7)",
          }
        );
      });
    </script>
  </body>
</html>
