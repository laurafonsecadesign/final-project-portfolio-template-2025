<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="logo.png" type="image/png" />
    <title>404 - Page Not Found | Laura Fonseca Portfolio</title>
    <!-- Google Fonts: Instrument Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/index.css" />
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  </head>
  <body>
    <div class="cursor"></div>
    <main>
      <section class="error-container">
        <h1 class="error-number">404</h1>
        <h2 class="error-title" data-translate="error.title">Page Not Found</h2>
        <p class="error-description" data-translate="error.description">
          Oops! The page you're looking for doesn't exist. Let's get you back on
          track.
        </p>
        <a
          href="index.html"
          class="error-button"
          data-translate="error.back_home"
          >Back Home</a
        >
      </section>
    </main>
    <script src="assets/js/main.js"></script>
  </body>
</html>
